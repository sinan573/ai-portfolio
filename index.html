<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexMotors | Ultimate Supercar Vault</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151c2e;
            --card-border: #222e48;
            --accent-red: #ff2e63;
            --accent-cyan: #08d9d6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --grad-accent: linear-gradient(135deg, #ff2e63 0%, #ff8e53 100%);
            --radius-xl: 16px;
            --radius-md: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #ff2e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Controls / Search Bar */
        .controls {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-red);
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background: #0b0f19;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-red);
        }

        .filter-select {
            padding: 12px 16px;
            background: #0b0f19;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        /* Grid Layout */
        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .car-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            cursor: pointer;
        }

        .car-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 46, 99, 0.5);
        }

        .car-img-wrap {
            position: relative;
            height: 200px;
            background: #0b0f19;
            overflow: hidden;
        }

        .car-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(11, 15, 25, 0.9);
            border: 1px solid var(--card-border);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .car-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .car-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .car-price {
            color: var(--accent-red);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 16px;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #0b0f19;
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }

        .spec-item {
            font-size: 0.85rem;
        }

        .spec-label {
            color: var(--text-muted);
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .spec-val {
            font-weight: 600;
            color: var(--text-main);
        }

        .btn-details {
            width: 100%;
            padding: 10px;
            background: var(--grad-accent);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            margin-top: auto;
            transition: opacity 0.2s ease;
        }

        .btn-details:hover {
            opacity: 0.9;
        }

        /* Modal Details Window */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--card-border);
            color: #fff;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-hero {
            height: 250px;
            width: 100%;
            position: relative;
        }

        .modal-hero img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .modal-subtitle {
            color: var(--accent-red);
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .modal-section-title {
            font-size: 1.1rem;
            color: var(--accent-cyan);
            margin: 18px 0 10px 0;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 6px;
        }

        .modal-history-box {
            background: #0b0f19;
            border: 1px solid var(--card-border);
            padding: 15px;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-gauge-high"></i> APEX MOTORS</h1>
            <p>Supercar Vault — Interactive Telemetry & Auction History</p>
        </header>

        <!-- Search & Brand Filter -->
        <div class="controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterCars()" placeholder="Search supercar by model, engine, or specs...">
            </div>
            <select id="brandFilter" class="filter-select" onchange="filterCars()">
                <option value="ALL">All Brands</option>
                <option value="Bugatti">Bugatti</option>
                <option value="Ferrari">Ferrari</option>
                <option value="Lamborghini">Lamborghini</option>
                <option value="Porsche">Porsche</option>
                <option value="Koenigsegg">Koenigsegg</option>
                <option value="Pagani">Pagani</option>
                <option value="McLaren">McLaren</option>
                <option value="Aston Martin">Aston Martin</option>
                <option value="Ford">Ford</option>
            </select>
        </div>

        <!-- Supercar List -->
        <div class="cars-grid" id="carsGrid"></div>

        <footer>
            <p>&copy; 2026 Sinan Miraj. Created for GitHub Pages Deployment.</p>
        </footer>
    </div>

    <!-- Modal Dialog Popup -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-hero">
                <img id="modalImg" src="" alt="Supercar">
            </div>
            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle">Car Title</h2>
                <div class="modal-subtitle" id="modalPrice">$0</div>

                <div class="modal-section-title"><i class="fa-solid fa-microchip"></i> Full Telemetry Specs</div>
                <div class="specs-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                    <div class="spec-item"><span class="spec-label">Horsepower</span><span class="spec-val" id="modalHp">-</span></div>
                    <div class="spec-item"><span class="spec-label">Top Speed</span><span class="spec-val" id="modalSpeed">-</span></div>
                    <div class="spec-item"><span class="spec-label">0-60 mph</span><span class="spec-val" id="modalAccel">-</span></div>
                    <div class="spec-item" style="grid-column: span 3;"><span class="spec-label">Engine</span><span class="spec-val" id="modalEngine">-</span></div>
                    <div class="spec-item" style="grid-column: span 3;"><span class="spec-label">Production Limit</span><span class="spec-val" id="modalUnits">-</span></div>
                </div>

                <div class="modal-section-title"><i class="fa-solid fa-chart-line"></i> Sales & Auction History</div>
                <div class="modal-history-box" id="modalHistory">
                    Sales history data loading...
                </div>
            </div>
        </div>
    </div>

            // BUGATTI

                img: "https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=600&q=75",

            },

            {

                name: "Ford GT Liquid Carbon",
                price: "$750,000",
                hp: "660 HP",
                speed: "216 mph (348 km/h)",

                engine: "3.5L Twin-Turbo EcoBoost V6",
                units: "Special Edition",

                history: "Features an unpainted full carbon-fiber body weave. Mecum auction prices regularly exceed $1.3 Million."
            }

        function renderCars(carList) {
            const grid = document.getElementById('carsGrid');
            grid.innerHTML = '';

            if (carList.length === 0) {
                grid.innerHTML = `<div class="no-results"><i class="fa-solid fa-car-side"></i><br>No supercars matched your search query.</div>`;
                return;
            }

            carList.forEach((car, idx) => {
                const card = `
                    <div class="car-card" onclick="openModal(${idx})">
                        <div class="car-img-wrap">
                            <img src="${car.img}" alt="${car.name}" loading="lazy">
                            <span class="brand-badge">${car.brand}</span>
                        </div>
                        <div class="car-content">
                            <h3 class="car-title">${car.name}</h3>
                            <div class="car-price">${car.price}</div>
                            <div class="specs-grid">
                                <div class="spec-item">
                                    <span class="spec-label">Horsepower</span>
                                    <span class="spec-val">${car.hp}</span>
                                </div>
                                <div class="spec-item">
                                    <span class="spec-label">Top Speed</span>
                                    <span class="spec-val">${car.speed}</span>
                                </div>
                                <div class="spec-item" style="grid-column: span 2;">
                                    <span class="spec-label">Engine Spec</span>
                                    <span class="spec-val">${car.engine}</span>
                                </div>
                            </div>
                            <button class="btn-details">View Full Specs & History</button>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function filterCars() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const selectedBrand = document.getElementById('brandFilter').value;

            const filtered = supercars.filter(car => {
                const matchesSearch = car.name.toLowerCase().includes(searchText) || 
                                      car.engine.toLowerCase().includes(searchText) ||
                                      car.brand.toLowerCase().includes(searchText);
                const matchesBrand = selectedBrand === 'ALL' || car.brand === selectedBrand;
                return matchesSearch && matchesBrand;
            });

            renderCars(filtered);
        }

        function openModal(index) {
            const car = supercars[index];
            document.getElementById('modalImg').src = car.img;
            document.getElementById('modalTitle').innerText = car.name;
            document.getElementById('modalPrice').innerText = car.price;
            document.getElementById('modalHp').innerText = car.hp;
            document.getElementById('modalSpeed').innerText = car.speed;
            document.getElementById('modalAccel').innerText = car.accel;
            document.getElementById('modalEngine').innerText = car.engine;
            document.getElementById('modalUnits').innerText = car.units;
            document.getElementById('modalHistory').innerText = car.history;

            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        renderCars(supercars);
    </script>
</body>
</html>
